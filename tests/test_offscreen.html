<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>ARGUS Offscreen Test</title>

    <style>
        .far-left {
            position: absolute;
            left: -9999px;
        }

        .tiny-text {
            font-size: 1px;
        }

        .display-none {
            display: none;
        }
    </style>
</head>
<body>
    <h1>ARGUS OFFSCREEN 테스트</h1>

    <p>NORMAL TEXT</p>

    <p class="far-left">
        OFFSCREEN TEST 1
    </p>

    <p class="tiny-text">
        OFFSCREEN TEST 2
    </p>

    <p class="display-none">
        OFFSCREEN TEST 3
    </p>
</body>
</html>
